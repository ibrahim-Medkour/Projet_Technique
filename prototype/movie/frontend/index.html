<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des genres</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->
    <header class="bg-gray-800 text-white p-6">

        <div class="max-w-5xl mx-auto">

            <h1 class="text-3xl font-bold">
                Administration
            </h1>

            <p class="text-gray-300 mt-1">
                Gestion des genres de films
            </p>

        </div>

    </header>


    <main class="max-w-5xl mx-auto p-6">

        <!-- FORMULAIRE AJOUTER -->
        <section class="bg-white p-6 rounded-lg shadow mb-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-5">
                Ajouter un genre
            </h2>


            <form id="genreForm" class="space-y-4">

                <div>

                    <label
                        for="nom"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Nom du genre
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Exemple : Action"
                        class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-gray-500"
                    >

                </div>


                <button
                    type="submit"
                    class="bg-gray-800 text-white px-5 py-2 rounded-md hover:bg-gray-700"
                >
                    Ajouter
                </button>

            </form>

        </section>


        <!-- LISTE DES GENRES -->
        <section class="bg-white p-6 rounded-lg shadow">

            <h2 class="text-2xl font-bold text-gray-800 mb-5">
                Liste des genres
            </h2>


            <div class="overflow-x-auto">

                <table class="w-full border-collapse">

                    <thead>

                        <tr class="bg-gray-800 text-white">

                            <th class="border border-gray-300 px-4 py-3 text-left">
                                ID
                            </th>

                            <th class="border border-gray-300 px-4 py-3 text-left">
                                Nom
                            </th>

                            <th class="border border-gray-300 px-4 py-3 text-left">
                                Description
                            </th>

                        </tr>

                    </thead>


                    <tbody id="genreTableBody">


                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="genre.js"></script>

</body>

</html>
